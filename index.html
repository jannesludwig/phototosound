<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A photograph crosses into another dimension and becomes a rhythmic audiovisual piece. Runs entirely in your browser.">
  <title>Photo to Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body class="state-landing">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <!-- landing -->
  <section id="landing">
    <label id="drop" for="file" tabindex="0">
      <span class="line">drop a photograph · or tap</span>
    </label>
    <input id="file" type="file" accept="image/jpeg,image/png,image/*">
    <nav id="demo"><span class="dim">demo</span> <button data-demo="0">i</button> <button data-demo="1">ii</button> <button data-demo="2">iii</button></nav>
    <p id="privacy">nothing leaves this page</p>
    <p id="msg" hidden></p>
  </section>

  <!-- reading: what the machine sees -->
  <pre id="readout" aria-live="polite"></pre>
  <div id="prompt" hidden>tap to listen</div>

  <!-- corner readouts -->
  <div class="corner tl"><div id="r-title">photo → sound</div><div id="r-sig">—</div></div>
  <div class="corner tr"><div id="r-bpm">—</div><div id="r-hz">—</div></div>
  <div class="corner bl"><div id="r-sec">—</div><div id="r-pos">—</div></div>
  <div class="corner br">
    <button id="r-world" title="switch world">—</button>
    <div id="r-xy">—</div>
    <ul id="worlds" hidden></ul>
  </div>

  <!-- sound debug mixer: press M (or tap "photo → sound") -->
  <aside id="mixer" hidden>
    <div class="mx-head"><span>mixer</span><span id="mx-count">—</span></div>
    <div id="mx-rows"></div>
    <div class="mx-foot">M toggles · mute / solo per layer</div>
  </aside>

  <!-- controls: appear on hover / tap -->
  <div id="controls">
    <button id="b-play" title="play / pause (space)">pause</button>
    <button id="b-new" title="new photograph">new</button>
    <label class="vol">vol <input id="b-vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button id="b-rec" title="record a webm of picture and sound">rec</button>
  </div>

  <!-- A classic script that always runs, even if the app module fails to load in this browser:
       the browser must never navigate to a dropped file, and picked / dropped files are queued
       until the app is ready (Safari/WebKit: empty MIME types are accepted by extension). -->
  <script>
    (function () {
      var queue = window.__p2sQueue = [];
      var input = document.getElementById('file');
      function isImage(f) { return f && (/^image\//.test(f.type) || (!f.type && /\.(jpe?g|png|heic|heif|webp|gif|bmp)$/i.test(f.name || ''))); }
      function hand(f) { if (!isImage(f)) return; if (window.__p2sLoad) window.__p2sLoad(f); else queue.push(f); }
      function cancel(e) { e.preventDefault(); if (e.dataTransfer) { try { e.dataTransfer.dropEffect = 'copy'; } catch (x) {} } }
      ['dragenter', 'dragover'].forEach(function (t) {
        window.addEventListener(t, function (e) { cancel(e); document.body.classList.add('dragging'); }, false);
      });
      window.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); }, false);
      window.addEventListener('drop', function (e) {
        cancel(e); document.body.classList.remove('dragging');
        var fs = (e.dataTransfer && e.dataTransfer.files) || [];
        for (var i = 0; i < fs.length; i++) if (isImage(fs[i])) { hand(fs[i]); break; }
      }, false);
      function picked() {
        var f = input.files && input.files[0];
        if (!f) return;
        hand(f);
        setTimeout(function () { try { input.value = ''; } catch (x) {} }, 0);   // allow picking the same file again
      }
      input.addEventListener('change', picked, false);
      // if the app has not started after 8 s, say so instead of failing silently
      setTimeout(function () {
        if (window.__p2sLoad) return;
        var m = document.getElementById('msg'); m.hidden = false;
        m.textContent = 'this browser could not start the piece (WebGL / JS modules). try a current Safari, Chrome or Firefox.';
      }, 8000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
