<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A photograph crosses into another dimension and becomes a rhythmic audiovisual piece. Runs entirely in your browser.">
  <title>Photo to Sound</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body class="state-landing">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <!-- landing -->
  <section id="landing">
    <label id="drop" for="file" tabindex="0">
      <span class="line">drop a photograph · or tap</span>
    </label>
    <input id="file" type="file" accept="image/jpeg,image/png" hidden>
    <nav id="demo"><span class="dim">demo</span> <button data-demo="0">i</button> <button data-demo="1">ii</button> <button data-demo="2">iii</button></nav>
    <p id="privacy">nothing leaves this page</p>
  </section>

  <!-- reading: what the machine sees -->
  <pre id="readout" aria-live="polite"></pre>
  <div id="prompt" hidden>tap to listen</div>

  <!-- corner readouts -->
  <div class="corner tl"><div>photo → sound</div><div id="r-sig">—</div></div>
  <div class="corner tr"><div id="r-bpm">—</div><div id="r-hz">—</div></div>
  <div class="corner bl"><div id="r-sec">—</div><div id="r-pos">—</div></div>
  <div class="corner br">
    <button id="r-world" title="switch world">—</button>
    <div id="r-xy">—</div>
    <ul id="worlds" hidden></ul>
  </div>

  <!-- controls: appear on hover / tap -->
  <div id="controls">
    <button id="b-play" title="play / pause (space)">pause</button>
    <button id="b-new" title="new photograph">new</button>
    <label class="vol">vol <input id="b-vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button id="b-rec" title="record a webm of picture and sound">rec</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
